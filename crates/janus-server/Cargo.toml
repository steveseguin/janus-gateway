[package]
name = "janus-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Janus Gateway WebRTC server (Rust implementation)"

[[bin]]
name = "janus-rs"
path = "src/main.rs"

[dependencies]
janus-core.workspace = true
janus-plugin-api.workspace = true
janus-transport-api.workspace = true
janus-event-api.workspace = true
janus-plugin-echotest = { path = "../plugins/janus-plugin-echotest" }
janus-plugin-videoroom = { path = "../plugins/janus-plugin-videoroom" }
janus-plugin-streaming = { path = "../plugins/janus-plugin-streaming" }
janus-transport-http = { path = "../transports/janus-transport-http" }
janus-transport-websocket = { path = "../transports/janus-transport-websocket" }
janus-whip-whep.workspace = true

tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
axum = { workspace = true }
tower.workspace = true
serde_json.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
